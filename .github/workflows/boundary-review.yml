name: Development boundary review
on:
  push:
    branches: [main, feat/development-boundary-packet]
    paths: ['research/corpus/**', 'tools/boundary*', 'tools/test_boundary*', 'docs/BOUNDARY_REVIEW*', '.github/workflows/boundary-review.yml']
  pull_request:
    paths: ['research/corpus/**', 'tools/boundary*', 'tools/test_boundary*', '.github/workflows/boundary-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-bound review, frozen frame and corpus regressions
        run: |
          mkdir -p boundary-evidence
          node tools/test_boundary_packet.cjs boundary-evidence/boundary-tests.json
          node tools/test_passage_corpus.cjs boundary-evidence/corpus-tests.json
          node tools/check_passage_corpus.cjs > boundary-evidence/frame.json
          for suite in analysis clusters stability lsa partitions hdbscan nmf gmm mds reviewed_units; do
            node "tools/test_browser_${suite}.cjs" > "boundary-evidence/regression-${suite}.log" 2>&1
          done
          node tools/test_speech_pilot.cjs > boundary-evidence/regression-speech.log 2>&1
          node tools/test_passage_comparison.cjs > boundary-evidence/regression-passage.log 2>&1
          node tools/test_latent.cjs > boundary-evidence/regression-latent.log 2>&1
          node tools/test_meeting_picker.cjs > boundary-evidence/regression-meeting.log 2>&1
          python3 tools/test_passage_types.py > boundary-evidence/regression-types.log 2>&1
      - name: Generate synthetic packet only; never collect sources
        run: |
          node - <<'JS'
          const fs=require('node:fs'),G=require('./tools/boundary_packet.cjs'),fixture=require('./tools/boundary_fixture.cjs');
          const c=fixture();fs.writeFileSync(process.env.RUNNER_TEMP+'/synthetic-corpus.json',JSON.stringify(c));
          G.build(c,process.env.RUNNER_TEMP+'/synthetic-packet').catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Isolated browser test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/qa-python"
          "$RUNNER_TEMP/qa-python/bin/pip" install --disable-pip-version-check --timeout 30 --retries 1 playwright==1.55.0
      - name: Direct-file desktop/mobile review, export and resume acceptance
        run: |
          "$RUNNER_TEMP/qa-python/bin/python" tools/test_boundary_ui.py "$RUNNER_TEMP/synthetic-packet" boundary-evidence/browser
          node tools/boundary_packet.cjs validate "$RUNNER_TEMP/synthetic-corpus.json" boundary-evidence/browser/synthetic-review.json > boundary-evidence/return-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-review-validation
          path: boundary-evidence/
          retention-days: 14
