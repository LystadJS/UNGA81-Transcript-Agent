name: Integrate meeting selection
on:
  push:
    branches: [feat/latent-comparison-phase-a]
    paths: ['tools/phase_meeting_patch.py', '.github/workflows/meeting-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latent-comparison-phase-a
      - name: Apply source-only patches
        run: python3 tools/phase_meeting_patch.py
      - name: Preserve the integrated sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/latent-core.js tools/test_latent_ui.cjs site/collector.js site/analysis-core.js site/analysis-ui.js site/index.html site/cluster-worker.js site/nmf-worker.js site/analysis.css
          git commit -m 'Integrate date-to-meeting selection and source-bound report generation'
          git push origin HEAD:feat/latent-comparison-phase-a
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test comparison and meeting boundaries
        run: |
          node tools/test_latent.cjs
          node tools/test_meeting_picker.cjs
          node tools/test_browser_analysis.cjs
      - name: Browser runtime
        run: |
          timeout 120 npm install --prefix "$RUNNER_TEMP/latent-qa" --ignore-scripts --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1 playwright@1.55.0
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo 'PW_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            timeout 180 "$RUNNER_TEMP/latent-qa/node_modules/.bin/playwright" install --only-shell chromium
          fi
      - name: Build and test both browser workflows
        env:
          NODE_PATH: ${{ runner.temp }}/latent-qa/node_modules
        run: |
          python3 tools/build_pages.py _site
          node tools/test_latent_ui.cjs _site latent-browser-validation
          node tools/test_meeting_picker_ui.cjs _site meeting-browser-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-and-meeting-integration
          path: |
            latent-browser-validation
            meeting-browser-validation
