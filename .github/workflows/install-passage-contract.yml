name: Integrate passage contract
on:
  push:
    branches: [feat/passage-corpus-contract]
    paths: ['.github/workflows/install-passage-contract.yml']
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/passage-corpus-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the locally validated source patch with digest and path checks
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          packed=base64.b64decode(''.join(Path(f'tools/_contract_patch_{i}.txt').read_text().strip() for i in range(1,5)),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='53c332633e8ba1c8970b00f6067a80d292a517475e76a69c4eee50e256eaaa73', 'Source transfer digest mismatch'
          patch=json.loads(lzma.decompress(packed))
          allowed={'research/corpus/contract.cjs','research/corpus/plan.json','research/corpus/development-options.json','research/corpus/.gitignore','tools/passage_corpus.cjs','tools/test_passage_corpus.cjs','tools/check_passage_corpus.cjs','docs/PASSAGE_CORPUS.md','docs/NEXT_STEPS.md','.github/workflows/corpus-contract.yml'}
          assert patch['schema']=='un.source-patch.v1' and set(patch['files'])==allowed
          for name,content in patch['files'].items():
              p=Path(name)
              if name in patch['expected_old_sha256']:
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==patch['expected_old_sha256'][name], name
              else:
                  assert not p.exists(), name
          for name,content in patch['files'].items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content.encode('utf-8'))
          print('Verified and installed 10 source files')
          PY
      - name: Restore the already frozen metadata frame without reopening sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37653850412 --repo LystadJS/UNGA81-Transcript-Agent --name corpus-contract-evidence --dir "$RUNNER_TEMP/frozen-frame"
          cp "$RUNNER_TEMP/frozen-frame/inventory-frame.json" research/corpus/inventory.json
          node - <<'JS'
          const fs=require('node:fs'),C=require('./research/corpus/contract.cjs');
          const p='research/corpus/',read=f=>JSON.parse(fs.readFileSync(p+f,'utf8'));
          const frame=C.makeFrame(read('inventory.json'),read('plan.json'));
          C.assert(frame.sha256==='9a814f3f7986896f553072d5a610f6874b57a16adc4c15696da4998ce9b133e0','Frozen frame changed');
          fs.writeFileSync(p+'frame.json',JSON.stringify(frame,null,2)+'\n',{flag:'wx'});
          JS
      - name: Execute new contract and existing numerical/source acceptance
        run: |
          mkdir -p corpus-evidence
          node tools/check_passage_corpus.cjs > corpus-evidence/frame.json
          node tools/test_passage_corpus.cjs corpus-evidence/contract-tests.json > corpus-evidence/contract-tests.log
          for suite in analysis clusters stability lsa partitions hdbscan nmf gmm mds reviewed_units; do
            node "tools/test_browser_${suite}.cjs" > "corpus-evidence/regression-${suite}.log" 2>&1
          done
          node tools/test_speech_pilot.cjs > corpus-evidence/regression-speech.log 2>&1
          node tools/test_passage_comparison.cjs > corpus-evidence/regression-passage.log 2>&1
          node tools/test_latent.cjs > corpus-evidence/regression-latent.log 2>&1
          node tools/test_meeting_picker.cjs > corpus-evidence/regression-meeting.log 2>&1
          python3 tools/test_passage_types.py > corpus-evidence/regression-types.log 2>&1
      - name: Collect every frozen development meeting and verify full source lineage
        run: |
          mkdir -p research/corpus/work
          node tools/passage_corpus.cjs collect-development research/corpus/frame.json research/corpus/work/source
          node tools/passage_corpus.cjs build research/corpus/frame.json research/corpus/work/source/source-bundle.json research/corpus/work/build > corpus-evidence/live-audit.json
          node tools/check_passage_corpus.cjs research/corpus/work/build corpus-evidence/live-check.json
          cp research/corpus/work/source/acquisition.json corpus-evidence/acquisition.json
          cp research/corpus/work/build/audit.json corpus-evidence/audit.json
          node tools/passage_corpus.cjs analyze-development research/corpus/work/build/corpus.json research/corpus/development-options.json research/corpus/work/development-analysis.json > corpus-evidence/development-analysis-status.json
      - name: Record validation without transcript text or invented review choices
        run: |
          python3 - <<'PY'
          import json, os, hashlib, subprocess
          from pathlib import Path
          read=lambda name:json.loads(Path('corpus-evidence',name).read_text())
          tests=read('contract-tests.json');assert tests['passed']==53 and tests['failed']==0
          acquisition=read('acquisition.json');assert acquisition['reserved_transcripts_requested']==0
          check=read('live-check.json');assert check['all_observed_code_points_accounted']
          receipt={'schema':'un.passage-contract-validation.v1','engine':'passage-corpus-1.0.0','integration_run':os.environ['GITHUB_RUN_ID'],'integration_input_commit':os.environ['GITHUB_SHA'],'new_synthetic_checks':{'passed':tests['passed'],'failed':tests['failed']},'existing_regression_suites':{'passed':15,'failed':0},'frame_and_lineage':check,'acquisition':acquisition,'corpus_audit':read('audit.json'),'development_analysis':read('development-analysis-status.json'),'holdout':'37 meetings reserved by metadata before development collection; no holdout transcript requested, fitted, scored or interpreted','review':'No new human boundary choices fabricated; completed owner pilot unchanged','scope':'Research CLI and contract only; browser interface, numerical fitting kernels and frozen un/ pipeline unchanged','node':subprocess.check_output(['node','--version'],text=True).strip()}
          Path('docs/PASSAGE_CORPUS_VALIDATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          Path('corpus-evidence/implementation-sha256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('research/corpus').glob('*')) if p.is_file()},indent=2)+'\n')
          PY
          git diff --exit-code b9a08bc4c28206f131aad33137bba92da5baa00a -- site un
      - name: Remove transport files and commit only validated implementation
        run: |
          rm tools/_contract_patch_{1,2,3,4}.txt .github/workflows/install-passage-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/corpus/contract.cjs research/corpus/plan.json research/corpus/development-options.json research/corpus/.gitignore research/corpus/frame.json research/corpus/inventory.json tools/passage_corpus.cjs tools/test_passage_corpus.cjs tools/check_passage_corpus.cjs docs/PASSAGE_CORPUS.md docs/PASSAGE_CORPUS_VALIDATION.json docs/NEXT_STEPS.md .github/workflows/corpus-contract.yml
          git add -u tools/_contract_patch_1.txt tools/_contract_patch_2.txt tools/_contract_patch_3.txt tools/_contract_patch_4.txt .github/workflows/install-passage-contract.yml
          git diff --cached --stat
          git commit -m 'Implement source-bound passage corpus, explicit summary weights and reserved temporal holdout'
          git push origin HEAD:feat/passage-corpus-contract
          git rev-parse HEAD > corpus-evidence/implementation-commit.txt
      - name: Preserve development-only source checkpoint outside the published repository
        if: always()
        run: |
          if [ -d research/corpus/work ]; then tar -czf corpus-evidence/development-checkpoint.tar.gz -C research/corpus work; fi
          cp docs/PASSAGE_CORPUS_VALIDATION.json corpus-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passage-contract-integration
          path: corpus-evidence/
          retention-days: 14
