    paths:
      - 'site/meeting-quick-reader.js'
      - 'site/text-units.js'
      - 'tools/test_text_units.cjs'
      - 'tools/test_object_expressions.cjs'
      - 'tools/test_saved_filters_ui.cjs'
      - 'site/analysis-ui.js'
      - 'site/issue*'
      - 'tools/test_issue*'
      - 'tools/issue_sampling_aggregate.cjs'
      - 'site/sc-drafts*'
      - 'tools/test_sc_draft*'
      - 'site/analysis-core.js'
      - 'site/position-comparison.js'
      - 'site/position-view.js'
      - 'tools/test_position_comparison.cjs'
      - 'tools/test_policy_catalogue.cjs'
      - 'tools/test_source_reviewed_positions.cjs'
      - 'tools/test_remaining_country_coverage.cjs'
      - 'tools/test_final_country_coverage.cjs'
      - 'tools/test_three_country_review.cjs'
      - 'tools/test_palau_national_positions.cjs'
      - 'tools/test_nearby_comparisons.cjs'
      - 'tools/test_documentary_comparisons.cjs'
      - 'tools/test_country_briefings.cjs'
      - 'tools/test_qualified_universal_jurisdiction.cjs'
      - 'tools/test_comprehensive_policy_coverage.cjs'
      - 'tools/comprehensive_policy_cases.json'
      - 'tools/test_position_comparison_ui.cjs'
      - 'site/collector.js'
      - 'site/meeting-picker.js'
      - 'tools/test_browser_briefing.cjs'
      - 'tools/test_collection_recovery.cjs'
      - 'tools/test_collection_recovery_ui.cjs'
      - 'tools/test_meeting_picker.cjs'
      - 'tools/test_meeting_quick_reader_ui.py'
      - 'tools/test_meeting_quick_reader_static.py'
      - 'tools/test_meeting_quick_reader*'
      - 'tools/preview_meeting_quick_reader.cjs'
      - 'research/reference_tests/quick_reader_sample_audit.cjs'
      - 'research/reference_tests/meeting_attribution_audit.cjs'
      - 'research/reference_tests/test_meeting_attribution.cjs'
      - '.github/workflows/meeting-quick-reader.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify offline quick reader, meeting selection and attribution
        run: |
          node tools/test_meeting_quick_reader.cjs
          node tools/test_meeting_quick_reader_context.cjs
          node research/reference_tests/test_meeting_attribution.cjs
          node tools/test_meeting_picker.cjs
          node tools/test_palau_national_positions.cjs
          node tools/test_nearby_comparisons.cjs
          node tools/test_documentary_comparisons.cjs
          node tools/test_country_briefings.cjs
          node tools/test_qualified_universal_jurisdiction.cjs
          node tools/test_browser_analysis.cjs
          node tools/test_browser_briefing.cjs
          node tools/test_text_units.cjs
          node tools/test_object_expressions.cjs
          node tools/test_collection_recovery.cjs
          node tools/test_issue_history_client.cjs
          node tools/test_issue_history_adversarial.cjs
          node tools/test_issue_candidates.cjs
          node tools/test_issue_models.cjs
          node tools/test_issue_report.cjs
          node tools/test_issue_summary.cjs
          node tools/test_sc_drafts.cjs
          node research/issue_history/ingest/test_extraction.cjs
      - name: Install browser harness only
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Browser acceptance against artificial UN source responses
        run: |
          google-chrome --version
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_collection_recovery_ui.cjs site collection-recovery-browser
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_saved_filters_ui.cjs site saved-filters-browser
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_position_comparison_ui.cjs site position-comparison-browser
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_issue_workflow_ui.cjs site issue-browser
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_issue_archive_ui.cjs site issue-archive-browser
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_issue_selective_ui.cjs site
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_sc_draft_ui.cjs site
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_issue_performance_ui.cjs site issue-performance-browser/metrics.json
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_issue_reopen_profile_ui.cjs site issue-reopen-profile/metrics.json
          node tools/test_issue_reopen_sampling_metrics.cjs
          BROWSER_PATH="$(command -v google-chrome)" node tools/test_issue_reopen_sampling_ui.cjs site issue-reopen-sampling/metrics.json
          CHROME_BINARY="$(command -v google-chrome)" python tools/test_meeting_quick_reader_ui.py quick-reader-browser
          node tools/preview_meeting_quick_reader.cjs quick-reader-synthetic.html
          CHROME_BINARY="$(command -v google-chrome)" python tools/test_meeting_quick_reader_static.py quick-reader-synthetic.html quick-reader-static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meeting-quick-reader-synthetic-browser
          path: |
            issue-browser/
            issue-archive-browser/
            issue-performance-browser/
            issue-reopen-profile/
            issue-reopen-sampling/
            collection-recovery-browser/
            saved-filters-browser/
            quick-reader-browser/
            quick-reader-static/
            quick-reader-synthetic.html
          retention-days: 14
