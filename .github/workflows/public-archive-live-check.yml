name: Verify public archive access
on:
  pull_request:
    paths: ['tools/check_public_archive.py', '.github/workflows/public-archive-live-check.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Public application to check anonymously
        type: choice
        options: [both, source, portfolio]
        default: both
  workflow_run:
    workflows: [Daily transcript warehouse]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: public-archive-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERIFY_TARGET: ${{ github.event_name == 'pull_request' && 'source' || inputs.target || 'both' }}
      EXPECTED_NOT_BEFORE: ${{ github.event.workflow_run.created_at || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python tools/check_public_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-archive-verification
          path: public-archive-verification.json
          retention-days: 14
