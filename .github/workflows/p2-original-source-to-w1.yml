name: P2 original-source authenticated W1 interface
on:
  push:
    branches: ['coord/p2-w1-verified-expansion-calibration-20261008']
    paths:
      - 'research/source_acquisition/p2_expansion/p2_to_w1_source_adapter.cjs'
      - 'research/source_acquisition/p2_expansion/test_p2_to_w1.cjs'
      - 'research/source_acquisition/p2_expansion/synthetic_calibration.py'
      - 'research/validation_framework/frame.cjs'
      - 'research/validation_framework/schemas/input-frame.v1.schema.json'
      - '.github/workflows/p2-original-source-to-w1.yml'
  pull_request:
    paths:
      - 'research/source_acquisition/p2_expansion/p2_to_w1_source_adapter.cjs'
      - 'research/source_acquisition/p2_expansion/test_p2_to_w1.cjs'
      - 'research/source_acquisition/p2_expansion/synthetic_calibration.py'
      - 'research/validation_framework/frame.cjs'
      - 'research/validation_framework/schemas/input-frame.v1.schema.json'
      - '.github/workflows/p2-original-source-to-w1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic original-proof fail-closed controls
        run: |
          node --check research/source_acquisition/p2_expansion/p2_to_w1_source_adapter.cjs
          node research/source_acquisition/p2_expansion/test_p2_to_w1.cjs
      - name: Unmodified existing W1 method and input regression suites
        run: |
          node research/validation_framework/tests/test_framework.cjs
          node research/validation_framework/tests/test_schema.cjs
      - name: Frozen legacy analytical interchange and source inventory companion
        run: |
          node docs/parallel-work/validate-contract.cjs
          node docs/parallel-work/test-source-inventory-v1.cjs
      - name: Parse additive W1 input schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/validation_framework/schemas/input-frame.v1.schema.json')
          j=json.loads(p.read_text())
          assert 'un.p2.original-pv-reconciled.v1' in j['properties']['source_schema']['enum']
          frozen=json.loads(Path('docs/parallel-work/interchange-v1.schema.json').read_text())
          assert 'un.p2.original-pv-reconciled.v1' not in frozen['properties']['upstream']['properties']['source_schema']['enum']
          print('PASS: source-only input added, legacy analytical interchange unchanged')
          PY

  preregistered-calibration-code:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install explicit fixed simulation dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Test calendar-year and source-meeting simulated calibration engine
        run: |
          python -m py_compile research/source_acquisition/p2_expansion/synthetic_calibration.py
          python research/source_acquisition/p2_expansion/synthetic_calibration.py --selftest
