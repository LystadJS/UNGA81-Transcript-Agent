name: W4 P1 2008-2015 original PV encrypted acquisition
on:
  push:
    branches: ['coord/w4-p1-original-pv-intake-20261013']
    paths:
      - 'research/source_acquisition/w4_2008_2015/encrypted_original_pv_intake.py'
      - '.github/workflows/w4-p1-encrypted-source-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predeclared-source-only-encrypted-intake:
    name: Development PV byte retrieval; sealed recipient-only output
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      P1_RECIPIENT_PUBKEY_B64: mtq6ybIGw4iXjOBV3QPfEbz69OsdIXooTUyDw9zB1nE=
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install single pinned encryption library
        run: python -m pip install cryptography==43.0.3
      - name: Deterministic preregistered split and encryption negative controls
        run: python research/source_acquisition/w4_2008_2015/encrypted_original_pv_intake.py --selftest
      - name: Fetch ONLY 90 development UN PV original bytes and seal to recipient
        shell: bash
        run: |
          set -euo pipefail
          python research/source_acquisition/w4_2008_2015/encrypted_original_pv_intake.py \
            --public-recipient-key "$P1_RECIPIENT_PUBKEY_B64" \
            --sealed-output w4_p1_2008_2015_development_originals.x25519_aesgcm \
            --workers 4
      - name: Upload ENCRYPTED original-PV private recipient artifact only
        uses: actions/upload-artifact@v4
        with:
          name: w4-p1-recipient-encrypted-2008-2015-PV-development-only
          path: w4_p1_2008_2015_development_originals.x25519_aesgcm
          retention-days: 1
          if-no-files-found: error
