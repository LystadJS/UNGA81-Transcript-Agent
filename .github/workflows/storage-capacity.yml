name: Measure project storage capacity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operational-store
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check huggingface-hub==0.36.0
      - name: Measure refs, object metadata and provider meter without source downloads
        run: python tools/measure_storage_capacity.py
      - uses: actions/upload-artifact@v4
        with:
          name: storage-capacity
          path: ${{ runner.temp }}/storage-capacity.json
          retention-days: 30
