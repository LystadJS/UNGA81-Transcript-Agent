name: Operational pipeline contracts

on:
  pull_request:
    paths: ['tools/continue_owner_review.py', 'tools/export_owner_training.py', '.github/workflows/owner-training-export.yml', 'src/**', 'tests/**', 'config/**', 'site/archive*', 'site/meeting-report*', 'site/reporting-exclusions.json', 'tools/build_pages.py', 'tools/measure_storage_capacity.py', '.github/workflows/storage-capacity.yml', 'tools/write_operational_receipt.py', 'tools/observe_operational_runs.py', 'tools/inspect_operational_run.py', 'tools/storage_recovery_drill.py', 'tools/audit_private_exports.py', 'tools/provision_public_metadata.py', '.github/workflows/public-metadata-provision.yml', '.github/workflows/restored-export-audit.yml', '.github/workflows/storage-recovery.yml', 'tools/*reviewer*', 'tests/browser_owner_review.py', '.github/workflows/owner-reviewer.yml', 'requirements-model.txt', '.github/workflows/operational*.yml', '.github/workflows/model-training.yml']
  push:
    branches: [main]
    paths: ['tools/continue_owner_review.py', 'tools/export_owner_training.py', '.github/workflows/owner-training-export.yml', 'src/**', 'tests/**', 'config/**', 'site/archive*', 'site/meeting-report*', 'site/reporting-exclusions.json', 'tools/build_pages.py', 'tools/measure_storage_capacity.py', '.github/workflows/storage-capacity.yml', 'tools/write_operational_receipt.py', 'tools/observe_operational_runs.py', 'tools/inspect_operational_run.py', 'tools/storage_recovery_drill.py', 'tools/audit_private_exports.py', 'tools/provision_public_metadata.py', '.github/workflows/public-metadata-provision.yml', '.github/workflows/restored-export-audit.yml', '.github/workflows/storage-recovery.yml', 'tools/*reviewer*', 'tests/browser_owner_review.py', '.github/workflows/owner-reviewer.yml', 'requirements-model.txt', '.github/workflows/operational*.yml', '.github/workflows/model-training.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned owner-transfer cryptography
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - name: Source-free collection, persistence, publication and model contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install pinned browser harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read-only archive browser acceptance with synthetic data
        shell: bash
        run: |
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          export BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node tests/test_archive_ui.cjs
      - name: Source-bound meeting report contracts and browser workflow
        shell: bash
        run: |
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          export BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node tests/test_meeting_report.cjs
          node tests/test_meeting_selection.cjs
          node tests/test_mission_preferences.cjs
          node tests/test_meeting_reports_ui.cjs
          node tests/test_archive_reporting_ui.cjs
      - name: Browser owner review round-trip with synthetic passages
        run: python tests/browser_owner_review.py
      - name: Build allowlisted public site
        run: python tools/build_pages.py "$RUNNER_TEMP/operational-site"
