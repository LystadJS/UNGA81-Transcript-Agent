name: Operational pipeline contracts

on:
  pull_request:
    paths: ['un/**', 'tools/package_checksums.py', 'tools/receive_owner_review.py', '.github/workflows/owner-review-intake.yml', 'tools/continue_owner_review.py', 'tools/export_owner_training.py', '.github/workflows/owner-training-export.yml', 'src/**', 'tests/**', 'config/**', 'site/archive*', 'site/campaign-notebook*', 'site/meeting-report*', 'site/reporting-exclusions.json', 'tools/build_pages.py', 'tools/reporting_usability.cjs', 'tools/measure_storage_capacity.py', '.github/workflows/storage-capacity.yml', 'tools/write_operational_receipt.py', 'tools/observe_operational_runs.py', 'tools/inspect_operational_run.py', 'tools/storage_recovery_drill.py', 'tools/audit_private_exports.py', 'tools/provision_public_metadata.py', '.github/workflows/public-metadata-provision.yml', '.github/workflows/restored-export-audit.yml', '.github/workflows/storage-recovery.yml', 'tools/*reviewer*', 'tests/browser_owner_review.py', '.github/workflows/owner-reviewer.yml', 'requirements-model.txt', '.github/workflows/operational*.yml', '.github/workflows/model-training.yml']
  push:
    branches: [main]
    paths: ['un/**', 'tools/package_checksums.py', 'tools/receive_owner_review.py', '.github/workflows/owner-review-intake.yml', 'tools/continue_owner_review.py', 'tools/export_owner_training.py', '.github/workflows/owner-training-export.yml', 'src/**', 'tests/**', 'config/**', 'site/archive*', 'site/campaign-notebook*', 'site/meeting-report*', 'site/reporting-exclusions.json', 'tools/build_pages.py', 'tools/reporting_usability.cjs', 'tools/measure_storage_capacity.py', '.github/workflows/storage-capacity.yml', 'tools/write_operational_receipt.py', 'tools/observe_operational_runs.py', 'tools/inspect_operational_run.py', 'tools/storage_recovery_drill.py', 'tools/audit_private_exports.py', 'tools/provision_public_metadata.py', '.github/workflows/public-metadata-provision.yml', '.github/workflows/restored-export-audit.yml', '.github/workflows/storage-recovery.yml', 'tools/*reviewer*', 'tests/browser_owner_review.py', '.github/workflows/owner-reviewer.yml', 'requirements-model.txt', '.github/workflows/operational*.yml', '.github/workflows/model-training.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned owner-transfer cryptography
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - name: Current tracked R package integrity
        run: python tools/package_checksums.py
      - name: Source-free collection, persistence, publication and model contracts
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_reporting_browser_fixture.cjs
          node tests/test_campaign_notebook.cjs
      - name: Install pinned browser harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read-only archive browser acceptance with synthetic data
        shell: bash
        run: |
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          export BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node tests/test_archive_ui.cjs
      - name: Reporting and manual campaign browser workflows
        shell: bash
        run: |
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          export BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node tests/test_campaign_notebook_ui.cjs
          node tests/test_meeting_report.cjs
          node tests/test_report_country_timeline.cjs
          node tests/test_report_remove_sources.cjs
          node tests/test_report_append_sources.cjs
          node tests/test_report_appendix.cjs
          node tests/test_report_passage_notes.cjs
          node tests/test_report_questions.cjs
          node tests/test_report_context.cjs
          node tests/test_report_draft.cjs
          node tests/test_report_calendar.cjs
          node tests/test_report_package.cjs
          node tests/test_meeting_selection.cjs
          node tests/test_mission_preferences.cjs
          node tests/test_meeting_reports_ui.cjs
          node tests/test_report_remove_sources_ui.cjs
          node tests/test_reporting_usability.cjs
          node tests/test_report_collect_append_ui.cjs
          node tests/test_report_draft_ui.cjs
          node tests/test_report_calendar_ui.cjs
          node tests/test_report_affiliation_navigation_ui.cjs
          node tests/test_report_bulk_appendix_ui.cjs
          node tests/test_report_append_sources_ui.cjs
          node tests/test_report_replacement_ui.cjs
          node tests/test_device_report_ui.cjs
          node tests/test_report_package_open_ui.cjs
          node tests/test_report_package_ui.cjs
          node tests/test_report_word_ui.cjs
          node tests/test_report_print_ui.cjs
          node tests/test_archive_reporting_ui.cjs
      - name: Browser owner review round-trip with synthetic passages
        run: python tests/browser_owner_review.py
      - name: Build allowlisted public site
        run: python tools/build_pages.py "$RUNNER_TEMP/operational-site"
