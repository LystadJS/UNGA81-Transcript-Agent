name: Coordinator PR66 pinned ONNX synthetic verification
on:
  push:
    branches: ['coord/pr66-effective-tree-20261015']
permissions:
  contents: read
jobs:
  pinned-real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact upstream runtime dependencies
        run: python -m pip install -r research/semantic_review/requirements.txt
      - name: Verify all ten immutable pinned model files
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request,time
          from pathlib import Path
          lock=json.loads(Path('research/semantic_review/model-lock.json').read_text())
          base=Path('/tmp/unga-pinned-minilm')
          for name,record in lock['files'].items():
              target=base/name;target.parent.mkdir(parents=True,exist_ok=True)
              error=None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(record['url'],timeout=120) as response, target.open('wb') as out:
                          while chunk:=response.read(1024*1024): out.write(chunk)
                      if target.stat().st_size != record['bytes'] or hashlib.sha256(target.read_bytes()).hexdigest()!=record['sha256']:
                          raise ValueError('immutable pinned checkpoint digest mismatch: '+name)
                      error=None;break
                  except Exception as exc:
                      error=exc
                      if attempt<2:time.sleep(3)
              if error:raise error
          print('TEN_ORIGINAL_PINNED_ARTIFACTS_PASS')
          PY
      - name: Native MiniLM long-input, tokenizer audit and cold/warm cache
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python - <<'PY'
          import hashlib,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path('research/semantic_representations').resolve()))
          from fixtures import fixture_frame
          from pipeline import encode,sha
          from local_model import LocalModelEncoder,model_identity
          frame=fixture_frame()
          row=frame['rows'][0]
          row['text']=('Synthetic international cooperation language, with Unicode café. ' * 90)
          row['text_sha256']=sha(row['text'].encode())
          model=model_identity()
          encoder=LocalModelEncoder(Path('/tmp/unga-pinned-minilm'))
          settings={'metric':'cosine','pooling':'upstream_chunk_token_weighted'}
          with tempfile.TemporaryDirectory() as tmp:
              a=encode(frame,model,settings,encoder,Path(tmp),batch_size=4)
              assert a['coverage']['encoded']==16,a['coverage']
              assert a['coverage']['not_fitted']==0,a['coverage']
              long=next(r for r in a['rows'] if r['id']==row['id'])
              assert long['chunks']>1,long
              b=encode(frame,model,settings,encoder,Path(tmp),batch_size=4)
              assert b['coverage']['cache_hits']==16,b['coverage']
              assert a['rows']==b['rows']
              print('PINNED_ONNX_16_OF_16_PASS; LONG_WORDPIECES_CHUNKED; WARM_CACHE_16_OF_16_PASS; NO_NETWORK_IN_INFERENCE')
          PY

      - name: Independent-process synthetic contrast and dependency wheel receipts
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps -r research/semantic_review/requirements.txt -d "$RUNNER_TEMP/pinned-wheels" --quiet
          python - "$RUNNER_TEMP/pinned-wheels" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          files=sorted(Path(sys.argv[1]).iterdir())
          assert len(files)==6, [p.name for p in files]
          print('DEPENDENCY_WHEELS_SHA256='+json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files},sort_keys=True))
          PY
          cat > "$RUNNER_TEMP/benchmark.py" <<'PY'
          import hashlib,json,sys,tempfile
          from pathlib import Path
          import numpy as np
          sys.path.insert(0,str(Path('research/semantic_representations').resolve()))
          from fixtures import CONTRASTS
          from local_model import LocalModelEncoder,model_identity
          from pipeline import encode,sha
          from fixtures import fixture_frame
          frame=fixture_frame()
          encoder=LocalModelEncoder(Path('/tmp/unga-pinned-minilm'))
          with tempfile.TemporaryDirectory() as d:
              out=encode(frame,model_identity(),{'metric':'cosine','pooling':'upstream_chunk_token_weighted'},encoder,Path(d),batch_size=4)
              assert out['coverage']['encoded']==16 and out['coverage']['failed_batches']==0
              data={x['id']:np.asarray(x['vector'],dtype=np.float64) for x in out['rows'] if x['status']=='encoded'}
              observations=[]
              for case in CONTRASTS:
                  key=case['id'];anchor=data[key+':anchor']
                  similarities={role:round(float(np.dot(anchor,data[key+':'+role])),8) for role in ('paraphrase','opposite','protocol')}
                  observations.append({'case':key,'cosine':similarities,'paraphrase_gt_opposite':similarities['paraphrase']>similarities['opposite']})
              print(json.dumps({'cases':observations,'successes':sum(x['paraphrase_gt_opposite'] for x in observations),'attempted':len(observations),'failed_fits':out['coverage']['failed_batches'],'rows':len(data),'vector_sha256':hashlib.sha256(json.dumps({k:[round(float(z),7) for z in v] for k,v in sorted(data.items())},sort_keys=True,separators=(',',':')).encode()).hexdigest()},sort_keys=True))
          PY
          python "$RUNNER_TEMP/benchmark.py" > "$RUNNER_TEMP/contrast1.json"
          python "$RUNNER_TEMP/benchmark.py" > "$RUNNER_TEMP/contrast2.json"
          python - "$RUNNER_TEMP/contrast1.json" "$RUNNER_TEMP/contrast2.json" <<'PY'
          import json,sys
          a,b=[json.load(open(p)) for p in sys.argv[1:]]
          assert a['attempted']==b['attempted']==4 and a['rows']==b['rows']==16
          assert a['failed_fits']==b['failed_fits']==0
          assert a==b,'independent process output drift'
          print('INDEPENDENT_TWO_PROCESS_REPLAY_PASS='+json.dumps(a,sort_keys=True))
          PY
