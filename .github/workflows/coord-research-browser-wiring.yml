name: Coordinator research browser wiring (synthetic only)
on:
  pull_request:
    paths:
      - 'site/research.html'
      - 'site/research.css'
      - 'site/research-browser.js'
      - 'site/index.html'
      - 'site/latent.html'
      - 'tools/build_pages.py'
      - 'tools/test_research_browser_*'
      - 'docs/parallel-work/BROWSER_WIRING_REVIEW.md'
      - '.github/workflows/coord-research-browser-wiring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: W5/W6 shared preview source-contract and negative checks
        run: |
          node --test tools/test_research_browser_wiring.cjs
          node docs/parallel-work/validate-contract.cjs
          node --test site/experimental/evidence-viz/tests.cjs
          node site/parallel/w05-browser/experimental/method-lab/test-method-lab.cjs
      - name: Static asset allowlist and existing browser regression
        run: |
          python tools/test_research_browser_build.py
          node tools/test_latent.cjs
          node tools/test_browser_analysis.cjs
      - name: Verify frozen evaluation and public manifest not modified
        run: |
          python - <<'PY'
          import pathlib,subprocess
          # On pull_request, HEAD is the test merge; HEAD^ is the latest base.
          # Compare the whole proposed tree, not a historical shallow-clone SHA.
          files=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          protected=['research/reference_tests/evaluation-lock.json','site/release.json',
                     'site/numerics-manifest.json','AGENTS.md','docs/NEXT_STEPS.md']
          assert not any(p in files for p in protected),files
          assert not any(x.startswith(('un/','research/corpus/','research/reference_tests/')) for x in files),files
          assert not any(x.startswith('site/experimental/evidence-viz/') or
                         x.startswith('site/parallel/w05-browser/') for x in files),files
          print('PASS: protected source and source/worker namespaces unchanged')
          PY
  chromium:
    needs: contract-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local-browser QA harness
        run: |
          python -m pip install playwright==1.55.0
          (command -v google-chrome || command -v chromium)
      - name: Build allowlisted static browser in an isolated output directory
        run: python tools/build_pages.py "$RUNNER_TEMP/research-site"
      - name: Real Chromium desktop/mobile and source-safety checks
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium)"
          python tools/test_research_browser_ui.py \
            --site "$RUNNER_TEMP/research-site" \
            --outdir "$RUNNER_TEMP/research-browser-qa" \
            --browser-path "$BROWSER"
      - name: W5 existing real-Chromium local execution regression
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium)"
          # Chromium can finish a valid receipt just before releasing its temporary
          # profile directory. Retry only that exact cleanup race, and require a
          # subsequent zero-exit execution; never conceal a failing test.
          for attempt in 1 2 3; do
            set +e
            BROWSER_BIN="$browser" node site/parallel/w05-browser/experimental/method-lab/test-browser.cjs \
              > "$RUNNER_TEMP/w5-chrome-$attempt.log" 2>&1
            code=$?
            set -e
            cat "$RUNNER_TEMP/w5-chrome-$attempt.log"
            if [ "$code" -eq 0 ]; then
              echo "PASS: clean-exit W5 Chrome regression on attempt $attempt"
              exit 0
            fi
            if grep -q 'ENOTEMPTY: directory not empty' "$RUNNER_TEMP/w5-chrome-$attempt.log" \
                && grep -q '"status": "PASS"' "$RUNNER_TEMP/w5-chrome-$attempt.log" \
                && grep -q '"numeric_parity"' "$RUNNER_TEMP/w5-chrome-$attempt.log"; then
              echo "::warning::W5 browser receipt passed but Chrome cleanup raced (attempt $attempt); retrying full test."
            else
              echo "::error::W5 Chrome substantive test failure (attempt $attempt)."
              exit "$code"
            fi
          done
          echo "::error::W5 Chrome did not complete a clean-exit verification after 3 attempts."
          exit 1
      - name: Upload synthetic-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-research-wiring-synthetic-qa
          path: ${{ runner.temp }}/research-browser-qa/
          retention-days: 7
          if-no-files-found: warn
