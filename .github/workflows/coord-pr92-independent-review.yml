name: Coordinator PR92 independent contrast acceptance
on:
  pull_request:
    paths:
      - 'research/integration/w2_w4_w6/pr92_review/**'
      - '.github/workflows/coord-pr92-independent-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [head, effective-tree]
    env:
      CANDIDATE: '76fbfd73f440306dfd9fc72a6431704f7b09b45d'
      BASE: 'da4ab9ed11dba3693d11aa12f5333963b1b85478'
      MODE: ${{ matrix.mode }}
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: reviewer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '76fbfd73f440306dfd9fc72a6431704f7b09b45d'
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin code and allocate isolated evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pr92-review-$MODE"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/evidence"
          cd candidate
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git fetch --no-tags origin "$BASE"
          if [ "$MODE" = effective-tree ]; then
            TREE=$(git merge-tree --write-tree "$CANDIDATE" "$BASE")
            git read-tree --reset -u "$TREE"
          else
            TREE=$(git rev-parse 'HEAD^{tree}')
          fi
          printf '%s\n' "candidate=$CANDIDATE" "base=$BASE" "mode=$MODE" "tree=$TREE" "reviewer=$(git -C ../reviewer rev-parse HEAD)" > "$OUT/evidence/identity.txt"
          git diff --name-status "$BASE" "$TREE" > "$OUT/evidence/tree-diff.txt"
          git diff --name-status 81110db49786a05f9c8f8ce4d5103c92fe255586 "$CANDIDATE" > "$OUT/evidence/phase2-diff.txt"
          git ls-tree -r "$TREE" -- research/integration/w2_w4_w6/waggoner/phase2 .github/workflows/coord-us-relative-phase2.yml > "$OUT/evidence/code-blobs.txt"
          cp -r ../reviewer/research/integration/w2_w4_w6/pr92_review "$OUT/reviewer-source"
          cp ../reviewer/.github/workflows/coord-pr92-independent-review.yml "$OUT/reviewer-source/"
          cat "$OUT/evidence/identity.txt"
      - name: Require native R and Chromium
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core
          Rscript --vanilla -e 'stopifnot(getRversion() >= "4.3.0"); cat(R.version.string,"\n")'
          python -m pip install -r candidate/research/longitudinal/requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/axe" --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Unchanged upstream and candidate suites
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          {
            GITHUB_SHA="$CANDIDATE" python -m research.integration.w2_w4_w6.waggoner.run_tests --require-complete --receipt "$OUT/evidence/phase1.json"
            python -m unittest discover -s research/longitudinal -p 'test_*.py' -v
            python -m unittest research.integration.w2_w4_w6.test_w4_bridge -v
            node docs/parallel-work/validate-contract.cjs
            node docs/parallel-work/test-w1-w2-inference-readiness.cjs
            python -m unittest research.integration.w2_w4_w6.waggoner.phase2.test_build -v
            python -m research.integration.w2_w4_w6.waggoner.phase2.build --out "$OUT/build"
            node research/integration/w2_w4_w6/waggoner/phase2/verify_catalogue.cjs "$OUT/build"
            PHASE2_BUILD_DIR="$OUT/build" node --test research/integration/w2_w4_w6/waggoner/phase2/test_views.cjs
            python -m research.integration.w2_w4_w6.waggoner.phase2.test_browser --build-dir "$OUT/build" --artifact-dir "$OUT/evidence/original" --require-axe --axe "$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js"
          } 2>&1 | tee "$OUT/evidence/original-tests.log"
      - name: Independent per-target contrast and source calculations
        shell: bash
        run: |
          set -euo pipefail
          python reviewer/research/integration/w2_w4_w6/pr92_review/test_review.py --build "$OUT/build" --out "$OUT/evidence/independent" --axe-results "$OUT/evidence/original/axe-results.json" 2>&1 | tee "$OUT/evidence/independent-tests.log"
      - name: Retain synthetic review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr92-independent-${{ matrix.mode }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14
