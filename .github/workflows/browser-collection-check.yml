name: Check live browser collection

on:
  # External-service monitoring is separate from release acceptance.
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Playwright 1.57 supports this image; ubuntu-latest advanced to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic analysis and committee regression tests
        run: node tools/test_browser_analysis.cjs

      - name: Install developer-only browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium

      # The harness uses the fixed October 1 development date, never reserved October 5–6 meetings.
      - name: Exercise actual UN collection through browser controls
        run: python tools/test_live_browser.py --site site --live --output live-check/browser

      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collection-acceptance
          # Raw transcripts, source-bearing reports and screenshots stay on the
          # ephemeral runner. Publish only source-free acceptance receipts.
          path: |
            live-check/browser/result.json
            live-check/browser/failure.json
          retention-days: 7
