name: Verify restored research exports
on:
  workflow_dispatch:
permissions:
  contents: read
# Serialize with publication even though this job makes no remote writes.
concurrency:
  group: operational-store
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check huggingface-hub==0.36.0
      # Never upload restored databases, exports, or source-bearing differences.
      - run: python tools/audit_private_exports.py
