name: Latent comparison acceptance
on:
  push:
    branches: [main, feat/latent-comparison-phase-a]
    paths: ['site/**', 'tools/*latent*', '.github/workflows/latent-comparison.yml']
  pull_request:
    paths: ['site/**', 'tools/*latent*', '.github/workflows/latent-comparison.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing analytical and provenance regressions
        shell: bash
        run: |
          set -o pipefail
          for suite in analysis clusters stability lsa partitions hdbscan nmf gmm mds reviewed_units; do
            node "tools/test_browser_${suite}.cjs"
          done
          node tools/test_speech_pilot.cjs
          node tools/test_passage_comparison.cjs
          python3 tools/test_passage_types.py
      - name: Saved-run, parent and reusable-plan acceptance
        shell: bash
        run: |
          set -o pipefail
          node tools/test_latent.cjs | tee latent-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latent-numerical-validation
          path: latent-validation.log
  browser:
    needs: numerical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated browser QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/latent-qa" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/latent-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build the public site
        run: python3 tools/build_pages.py _site
      - name: Desktop, mobile, replay, exports and cancellation
        env:
          NODE_PATH: ${{ runner.temp }}/latent-qa/node_modules
        run: node tools/test_latent_ui.cjs _site latent-browser-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latent-browser-validation
          path: latent-browser-validation
