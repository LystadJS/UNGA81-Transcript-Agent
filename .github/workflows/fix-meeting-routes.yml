name: Validate canonical UN meeting routes
on:
  push:
    branches: [main]
    paths: ['tools/fix_meeting_routes.py', '.github/workflows/fix-meeting-routes.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source correction
        run: python3 tools/fix_meeting_routes.py
      - name: Validate the actual UN inventory and selected meeting
        env:
          REQUIRE_LIVE_MEETING: '1'
        run: node tools/check_meeting_live.cjs 2026-09-24 live-meeting-validation.json
      - name: Run analytical and source regressions
        run: |
          node tools/test_latent.cjs
          node tools/test_meeting_picker.cjs
          for suite in analysis clusters stability lsa partitions hdbscan nmf gmm mds reviewed_units; do
            node "tools/test_browser_${suite}.cjs"
          done
      - name: Prepare browser acceptance
        run: |
          timeout 120 npm install --prefix "$RUNNER_TEMP/qa" --ignore-scripts --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1 playwright@1.55.0
          if command -v google-chrome >/dev/null; then
            echo 'PW_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            timeout 180 "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --only-shell chromium
          fi
      - name: Run both actual browser workflows
        env:
          NODE_PATH: ${{ runner.temp }}/qa/node_modules
        run: |
          python3 tools/build_pages.py _site
          node tools/test_latent_ui.cjs _site latent-browser-validation
          node tools/test_meeting_picker_ui.cjs _site meeting-browser-validation
      - name: Preserve validated source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/meeting-picker-core.js site/collector.js site/analysis-core.js site/index.html site/analysis-ui.js site/cluster-worker.js site/nmf-worker.js site/release.json tools/test_meeting_picker.cjs tools/test_meeting_picker_ui.cjs docs/INDIVIDUAL_MEETINGS.md
          git commit -m 'Support canonical HRC and treaty-body meeting routes; verify live selected-meeting analysis'
          git push origin HEAD:main
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-meeting-validation
          path: |
            live-meeting-validation.json
            latent-browser-validation
            meeting-browser-validation
