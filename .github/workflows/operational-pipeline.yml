name: Daily transcript warehouse

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Training uploads use this same group. Never cancel a writer mid-publication.
concurrency:
  group: operational-store
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_PUBLIC_DATASET_REPO: ${{ vars.HF_PUBLIC_DATASET_REPO }}
      HF_ACCEPTED_MODEL_PATH: ${{ vars.HF_ACCEPTED_MODEL_PATH }}
      HF_ACCEPTED_MODEL_REVISION: ${{ vars.HF_ACCEPTED_MODEL_REVISION }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Require durable private storage
        shell: bash
        run: |
          if [[ -z "$HF_TOKEN" || -z "$HF_DATASET_REPO" ]]; then
            echo '::error::Set HF_TOKEN secret and HF_DATASET_REPO variable before running collection. No transient-only collection will be performed.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned storage client
        run: python -m pip install --disable-pip-version-check huggingface-hub==0.36.0
      - name: Load verified public metadata configuration
        run: |
          python - <<'PYCODE'
          import os
          from un_transcript.publication import load_publication_config
          config = load_publication_config('config/publication.json', os.environ['HF_DATASET_REPO'], os.environ.get('HF_PUBLIC_DATASET_REPO', ''))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('HF_PUBLIC_DATASET_REPO=' + config['public_repo'] + '\n')
          PYCODE
      - name: Verify private archive connection
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from un_transcript.snapshots import HFStorage
          storage = HFStorage(os.environ['HF_DATASET_REPO'])
          info, used = storage.info()
          if used >= storage.budget_bytes:
              raise SystemExit('Private archive storage budget exhausted; collection remains stopped.')
          entries = storage.api.get_paths_info(storage.repo_id, ['latest.json'], repo_type='dataset', revision=info.sha)
          measured = {'private': info.private, 'immutable_revision_verified': True,
                      'retained_storage_bytes': used, 'storage_budget_bytes': storage.budget_bytes,
                      'existing_snapshot_pointer': bool(entries)}
          (Path(os.environ['RUNNER_TEMP'])/'storage-preflight.json').write_text(json.dumps(measured))
          print(json.dumps(measured))
          PY
      - name: Load explicitly configured accepted local model
        if: env.HF_ACCEPTED_MODEL_PATH != '' || env.HF_ACCEPTED_MODEL_REVISION != ''
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 onnxruntime==1.22.1 transformers==4.53.3 safetensors==0.5.3 tokenizers==0.21.4
          python - <<'PY'
          import json, os, pathlib, re
          from huggingface_hub import snapshot_download
          from un_transcript.snapshots import HFStorage
          from un_transcript.models.runtime import load_accepted_model
          path=os.environ['HF_ACCEPTED_MODEL_PATH']; revision=os.environ['HF_ACCEPTED_MODEL_REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}',revision): raise SystemExit('Accepted model requires an immutable dataset revision')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*',path) or any(p in ('.','..') for p in path.split('/')): raise SystemExit('Invalid accepted model path')
          HFStorage(os.environ['HF_DATASET_REPO']).info()
          local=pathlib.Path(os.environ['RUNNER_TEMP'])/'un-approved-model'
          snapshot_download(os.environ['HF_DATASET_REPO'],repo_type='dataset',revision=revision,token=os.environ['HF_TOKEN'],local_dir=local,allow_patterns=[path+'/*'])
          load_accepted_model(local/path,json.loads(pathlib.Path('config/issues.json').read_text()))
          PY
      - name: Restore, collect, validate and publish one snapshot
        shell: bash
        run: |
          args=(run --config config/collection.json --workspace "$RUNNER_TEMP/un-warehouse" --remote hf --repo "$HF_DATASET_REPO" --publish-public "$RUNNER_TEMP/un-public")
          if [[ -n "$HF_PUBLIC_DATASET_REPO" ]]; then
            args+=(--public-repo "$HF_PUBLIC_DATASET_REPO")
          fi
          if [[ -n "$HF_ACCEPTED_MODEL_PATH" ]]; then
            args+=(--model-dir "$RUNNER_TEMP/un-approved-model/$HF_ACCEPTED_MODEL_PATH")
          fi
          python -m un_transcript "${args[@]}"
      # Only the explicit source-free receipt below may be uploaded as an
      # Actions artifact. Database, raw text and private CSVs stay private.
      - name: Record operational result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf 'Daily warehouse job: %s\n\n' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Durable snapshots are retained in the configured dataset repository. A failed or delayed job does not imply fresh source coverage. Check the published manifest timestamp and coverage before use.' >> "$GITHUB_STEP_SUMMARY"

          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          receipt=Path(os.environ['RUNNER_TEMP'])/'un-warehouse/last-run.json'
          if receipt.exists():
              result=json.loads(receipt.read_text())
              coverage=result.get('coverage',{})
              inventory=result.get('inventory_progress',{})
              lines=[
                  'Snapshot: `'+result['run_id']+'`',
                  'Snapshot generated at (UTC): '+result['generated_at'],
                  'Collection coverage: **'+result['status']+'**',
                  'Inventory reconciliation complete: '+str(inventory.get('complete','unavailable')),
                  'Inventory dates pending this week: '+str(inventory.get('pending_dates','unavailable'))+' / '+str(inventory.get('selected_dates','unavailable')),
                  'Nominal weekly inventory capacity sufficient: '+str(inventory.get('nominal_weekly_capacity_sufficient','unavailable')),
                  'Selection checkpoint reset: '+str(result.get('selection_reset','unavailable')),
                  'Stored distinct meetings: '+str(coverage.get('stored_meetings','unavailable')),
                  'Current transcript segments: '+str(coverage.get('segments','unavailable')),
                  'Meetings downloaded this run (includes refreshes): '+str(result['meetings_downloaded']),
                  'Private publication: '+result['private_publication'],
                  'Public metadata publication: '+result['public_publication'],
                  'Public publication error type: '+str(result.get('public_error_type') or 'none'),
                  'Public storage operation: '+str(result.get('public_storage_operation') or 'none'),
                  'Public HTTP status: '+str(result.get('public_http_status') or 'none'),
                  'Stance model: '+result['model_status']['status'],
                  'Download counts across runs must not be added as unique meeting coverage.'
              ]
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('\n\n'.join(lines)+'\n')
          else:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('No completed run receipt is available. Inspect the failed step and the last valid durable snapshot; do not infer freshness from this job.\n')
          PYCODE
      - name: Measure retained private and public repository storage
        if: always()
        continue-on-error: true
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from un_transcript.snapshots import HFStorage
          for role, key in [('private','HF_DATASET_REPO'), ('public','HF_PUBLIC_DATASET_REPO')]:
              repo = os.environ.get(key)
              if not repo: continue
              try:
                  storage = HFStorage(repo, private=role=='private')
                  _, used = storage.info()
                  value = {'retained_storage_bytes':used, 'storage_budget_bytes':storage.budget_bytes}
                  (Path(os.environ['RUNNER_TEMP'])/('storage-after-'+role+'.json')).write_text(json.dumps(value))
              except Exception:
                  # No provider exception strings: they may include signed URLs.
                  print('Storage measurement unavailable for '+role+' repository')
          PYCODE
      - name: Write source-free monitoring receipt
        if: always()
        env:
          PROCESSING_STATUS: ${{ job.status }}
        run: python tools/write_operational_receipt.py
      - name: Retain source-free monitoring receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operational-receipt.json
          if-no-files-found: warn
          retention-days: 30
