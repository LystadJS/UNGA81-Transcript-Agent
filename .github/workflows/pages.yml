name: Publish review workspace
on:
  push:
    branches: [main]
    paths: ['site/**', 'reports/hlw-cuba/**', 'tools/build_pages.py', 'tools/test_browser*.cjs', 'tools/*passage*', 'tools/*speech_pilot*', 'tools/browser-deps/**', 'un/config/countries.csv', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser analysis and collection
        run: node tools/test_browser_analysis.cjs
      - name: Test PCA, k-means and UMAP separation
        run: node tools/test_browser_clusters.cjs
      - name: Test grouped resampling and consensus accounting
        run: node tools/test_browser_stability.cjs
      - name: Test LSA, paired comparison and neighborhood preservation
        run: node tools/test_browser_lsa.cjs
      - name: Test PAM, hierarchical clustering and shared stability protocol
        run: node tools/test_browser_partitions.cjs
      - name: Test HDBSCAN, unassigned passages and noise-aware stability
        run: node tools/test_browser_hdbscan.cjs
      - name: Test NMF and reviewed inclusion
        run: node tools/test_browser_nmf.cjs
      - name: Test Gaussian mixtures, soft membership and grouped refits
        run: node tools/test_browser_gmm.cjs
      - name: Test metric MDS and fixed clustering independence
        run: node tools/test_browser_mds.cjs
      - name: Test passage masks, source identity and review decisions
        run: |
          python3 tools/test_passage_types.py
          node tools/test_passage_comparison.cjs
      - name: Test reviewed speech units and immutable source offsets
        run: node tools/test_speech_pilot.cjs
      - name: Build public site
        run: python3 tools/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
