name: Build private browser reviewer
on:
  workflow_dispatch:
    inputs:
      pilot_revision:
        description: Immutable private dataset commit containing the original pilot
        type: string
        required: true
        default: '81735557d162fe8e4180ea035bea172c5c00a929'
      pilot_prefix:
        description: Original private pilot directory, including trailing slash
        type: string
        required: true
        default: 'pilots/43156908706-1/'
permissions:
  contents: read
concurrency:
  group: operational-store
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      PILOT_REVISION: ${{ inputs.pilot_revision }}
      PILOT_PREFIX: ${{ inputs.pilot_prefix }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check huggingface-hub==0.36.0
      - run: python tools/build_private_reviewer.py
      # Never attach the source-bearing HTML to public Actions artifacts.
