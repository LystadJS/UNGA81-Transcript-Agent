name: Final comparison integration
on:
  push:
    branches: [feat/latent-comparison-phase-a]
    paths: ['tools/complete_ui_patch.py', '.github/workflows/finish-comparison.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latent-comparison-phase-a
      - name: Apply final source fixes
        run: python3 tools/complete_ui_patch.py
      - name: Preserve fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/test_meeting_picker_ui.cjs site/latent.css docs/BROWSER_ANALYSIS.md README.md
          git commit -m 'Refine comparison layout and current meeting-selection documentation'
          git push origin HEAD:feat/latent-comparison-phase-a
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser QA setup
        run: |
          timeout 120 npm install --prefix "$RUNNER_TEMP/latent-qa" --ignore-scripts --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1 playwright@1.55.0
          if command -v google-chrome >/dev/null; then
            echo 'PW_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            timeout 180 "$RUNNER_TEMP/latent-qa/node_modules/.bin/playwright" install --only-shell chromium
          fi
      - name: Build and exercise both workflows
        env:
          NODE_PATH: ${{ runner.temp }}/latent-qa/node_modules
        run: |
          python3 tools/build_pages.py _site
          node tools/test_latent.cjs
          node tools/test_meeting_picker.cjs
          node tools/test_latent_ui.cjs _site latent-browser-validation
          node tools/test_meeting_picker_ui.cjs _site meeting-browser-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-comparison-browser
          path: |
            latent-browser-validation
            meeting-browser-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-source-review
          path: |
            site
            tools/*.cjs
