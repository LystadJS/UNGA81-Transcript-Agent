[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "un-transcript-agent"
version = "0.1.0"
description = "Source-versioned UN transcript collection and reproducible research exports"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
storage = ["huggingface-hub==0.36.0"]

[project.scripts]
un-transcript = "un_transcript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
